[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mk8dx-item-alert-augmentor"
version = "0.1.0"
description = "Local MK8DX held-item alert prototype using OpenCV and YOLO."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.11,<6",
    "numpy>=2,<3",
    "ultralytics>=8.3.116,<9",
    "lap>=0.5.12,<1",
]

[project.scripts]
mk8dx-alert = "mk8dx_item_alert.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
